# ============================================================================
#  HARDENED broker  --  Module MQTT, "after" state
#  Applies controls M3 (no anonymous), M4 (topic ACLs), and, once you add
#  certificates, M1/M2 (TLS). Swap this in for mosquitto.insecure.conf and
#  re-run attacker.py to watch the intrusion fail.
# ============================================================================
listener 1883 0.0.0.0
allow_anonymous false                       # control M3: require authentication
password_file /mosquitto/config/passwd      # per-client credentials
acl_file /mosquitto/config/acl              # control M4: per-topic authorization
persistence false
connection_messages true
log_type all

# ---- control M1 / M2: MQTT over TLS (optional) ----
# Generate certs (see lab README), then uncomment to add an encrypted listener
# on 8883 so credentials and payloads are no longer readable in Wireshark:
#
# listener 8883 0.0.0.0
# cafile   /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile  /mosquitto/config/certs/server.key
# require_certificate false
